<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3a1724">
<title>Untuk Kamu ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#38232a;--wine:#672b3e}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}body{margin:0;min-height:100svh;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:#2a1409;overflow:hidden}
button{font:inherit}

/* ===== MEJA KAYU + BUKU (1 layar) ===== */
#dunia{position:fixed;inset:0;z-index:0;overflow:hidden;perspective:900px;background:#2a1409}
#dunia:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px #1b0b08d0}
#kamera{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;animation:terbang 4.8s cubic-bezier(.5,0,.15,1) both}
#kamera:before{content:"";position:absolute;inset:-120%;background:
radial-gradient(ellipse at 42% 43%,#b77b48 0,transparent 9%),
radial-gradient(ellipse at 59% 58%,#32180e 0,transparent 14%),
repeating-linear-gradient(95deg,#754326 0px,#8b512c 28px,#63371f 55px,#9b6035 83px)}
#meja{--E:min(390px,88vw);position:absolute;inset:0;transform-style:preserve-3d}
#meja:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 13px,#e2a56b0b 14px,#170b0708 16px)}
@keyframes terbang{0%{transform:translate3d(16%,-20%,-1100px) rotateX(62deg) rotateZ(-14deg)}55%{transform:translate3d(4%,-6%,-350px) rotateX(28deg) rotateZ(-4deg)}100%{transform:none}}
.book{position:absolute;border-radius:2px 5px 5px 2px;background:
linear-gradient(90deg,#0006,#0000 9%,#ffffff14 10%,#0000 12%),linear-gradient(135deg,var(--a),var(--b));
box-shadow:3px 5px 8px #0009,0 0 0 1px #0005}
.book:before{content:"";position:absolute;inset:9% 12% 9% 22%;border:1.5px solid #e6c77d99;border-radius:2px}
.book:after{content:"";position:absolute;right:-3px;top:2px;bottom:2px;width:4px;border-radius:0 2px 2px 0;background:repeating-linear-gradient(0deg,#f3e8cf 0 1px,#cdb98f 1px 2px)}
body.siap .grain{opacity:.13}
.grain{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}

/* ===== AMPLOP ===== */
#intro{position:absolute;inset:0;display:grid;place-items:center;padding:16px;transform:translateZ(60px);transform-style:preserve-3d}
.envelope-wrap{display:grid;place-items:center;perspective:1200px;animation:breathe 3.6s 4.8s ease-in-out infinite}
.envelope{width:min(390px,88vw);height:235px;position:relative;filter:drop-shadow(0 24px 25px #1b0909a8);cursor:pointer;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1),filter 1s}
body:not(.siap) .envelope{filter:drop-shadow(0 0 0 #0000)}
.env-back{position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff08 0px,#ffffff08 1px,transparent 2px,transparent 4px),linear-gradient(145deg,#a82d43 0%,#7e172d 48%,#4e1021 100%);border-radius:5px;box-shadow:inset 0 1px 2px #ffffff45,inset 0 -8px 18px #30081766}
.env-paper{position:absolute;left:8%;width:84%;height:86%;bottom:5%;background:repeating-linear-gradient(0deg,transparent 0 30px,#d8c9b5 31px,#d8c9b5 32px),linear-gradient(#fffdf8,#f3e8dc);border-radius:3px;transition:transform 1.1s cubic-bezier(.2,.7,.2,1);box-shadow:0 2px 8px #32101d22;z-index:1}
.env-front{position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff09 0px,#ffffff09 1px,transparent 2px,transparent 4px),linear-gradient(145deg,#9e2a40,#78172e 65%,#5a1024);clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);border-radius:4px;box-shadow:inset 0 -2px 8px #31081755;z-index:2}
.env-side{position:absolute;inset:0;background:linear-gradient(35deg,#3e0d1daa,#a65d6c55);clip-path:polygon(0 0,50% 57%,0 100%);z-index:2}
.env-side.right{clip-path:polygon(100% 0,50% 57%,100% 100%)}
.env-flap{position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff0a 0px,#ffffff0a 1px,transparent 2px,transparent 4px),linear-gradient(155deg,#bd3c51,#8c1d34 65%,#681329);clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transition:transform 1s cubic-bezier(.2,.7,.2,1);backface-visibility:hidden;z-index:3;filter:drop-shadow(0 3px 3px #26071155)}
.seal{position:absolute;z-index:4;left:50%;top:55%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:48% 52% 47% 53%;display:grid;place-items:center;color:#fff0c9;font-size:28px;background:radial-gradient(circle at 32% 25%,#fff0a8 0%,#d8a64c 17%,#98601e 42%,#704015 70%,#3d210f 100%);border:2px solid #d8ad5d;box-shadow:0 4px 8px #210b0c99,inset 0 2px 3px #fff2b8,inset 0 -4px 7px #32170799,0 0 0 3px #6c3d1c;transition:opacity .35s,transform .55s}
.seal:after{content:"";position:absolute;inset:5px;border:1px solid #f5d98b99;border-radius:48% 52% 47% 53%;pointer-events:none}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-25deg)}
.envelope.open .env-paper{transform:translateY(-125px);transition-delay:.35s;z-index:5}
.envelope.open{transform:translateY(20px) scale(1.14)}
@keyframes breathe{50%{transform:scale(1.06)}}

/* ===== SURAT ===== */
.letter{position:fixed;inset:0;z-index:2;overflow-y:auto;display:none}
.letter.show{display:block;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}
.letter-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 16px 50px}
.sheet{position:relative;width:min(100%,720px)}
.env-open{position:absolute;left:-6%;right:-6%;top:-8px;bottom:-48px;transform:rotate(-2deg);border-radius:6px;background:repeating-linear-gradient(115deg,#ffffff08 0 1px,transparent 2px 4px),linear-gradient(145deg,#a82d43,#7e172d 48%,#4e1021);box-shadow:0 22px 40px #1b0909b0,inset 0 1px 2px #ffffff45}
.env-open:before{content:"";position:absolute;left:0;right:0;bottom:100%;height:clamp(70px,16vw,130px);background:linear-gradient(155deg,#8c1d34,#681329);clip-path:polygon(0 100%,50% 0,100% 100%)}
.env-open:after{content:"";position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(115deg,#ffffff09 0 1px,transparent 2px 4px),linear-gradient(145deg,#9e2a40,#78172e 65%,#5a1024);clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%)}
.letter-card{position:relative;padding:clamp(30px,7vw,66px);border-radius:3px;box-shadow:0 20px 50px #000a,inset 0 0 50px #a8803f40,inset 0 0 2px #6b4a2466;background:
url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.04 .9' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .45 0 0 0 0 .33 0 0 0 0 .18 0 0 0 .5 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23p)' opacity='.4'/%3E%3C/svg%3E"),
radial-gradient(ellipse at 50% 45%,transparent 55%,#a8803f45 100%),
linear-gradient(0deg,transparent calc(33% - 1px),#6b4a2418 33%,#fff7 calc(33% + 1px),transparent calc(33% + 3px)),
linear-gradient(0deg,transparent calc(66% - 1px),#6b4a2418 66%,#fff7 calc(66% + 1px),transparent calc(66% + 3px)),
linear-gradient(135deg,#fdf5e1,#f2e2bd)}
.letter-card:before{content:"";position:absolute;inset:10px;border:1px solid #cdb48d;pointer-events:none}
.letter-top{font:10px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#a17b76;text-align:center}
.letter h2{text-align:center;font-weight:400;font-size:clamp(27px,5vw,38px);margin:26px 0;color:#713d4b}
.date{text-align:center;color:#ad8b83;font:12px Arial,sans-serif;letter-spacing:.15em}
.letter-body{max-width:510px;margin:35px auto 0;font-size:19px;line-height:1.9;color:#59434a;background:repeating-linear-gradient(transparent 0 calc(1.6em - 1px),#cdb98f calc(1.6em - 1px) 1.6em,transparent 1.6em 1.9em)}
.letter-body p{margin:0 0 1.9em}.letter-body p:last-child{margin:0}
.signature{text-align:right;font-style:italic;font-size:20px;color:#865361;margin:30px auto 0;max-width:510px}
.letter-actions{display:flex;justify-content:center;margin-top:78px}
.action{border:0;border-radius:99px;padding:13px 24px;background:var(--wine);color:#fff8f0;cursor:pointer;letter-spacing:.04em;box-shadow:0 8px 18px #0006;transition:transform .2s,background .2s}.action:hover{transform:translateY(-2px);background:#814052}

/* ===== SURAT DILIPAT (tiga lipatan, terbuka ke bawah) ===== */
.lipat{position:absolute;left:0;top:0;width:100%;perspective:1500px}
.pn{position:absolute;left:0;right:0;transform-style:preserve-3d}
.pn1,.pn2{top:100%;transform-origin:top}
.pn1{animation:buka1 1.1s .4s cubic-bezier(.3,.1,.2,1) both}
.pn2{animation:buka2 1s 1.2s cubic-bezier(.3,.1,.2,1) both}
@keyframes buka1{from{transform:translateZ(-2px) rotateX(-180deg)}to{transform:none}}
@keyframes buka2{from{transform:translateZ(2px) rotateX(180deg)}to{transform:none}}
.fr{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;background:#f6ead0;box-shadow:0 6px 14px #0005}
.bk{position:absolute;inset:0;transform:rotateX(180deg);backface-visibility:hidden;background:linear-gradient(135deg,#f0e0bb,#e4d0a3);box-shadow:0 6px 14px #0005}
.pn0 .fr{box-shadow:0 14px 30px #0008}

/* ===== KELOPAK MAWAR ===== */
#petals{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-90px;border-radius:75% 0 75% 0;background:radial-gradient(circle at 30% 30%,#ff8fa3,#c9304e 70%,#8d1030);box-shadow:inset -1px -1px 2px #5a0b1d66;animation:petal 9s linear forwards}
.petal.img{background:transparent center/contain no-repeat;border-radius:0;box-shadow:none}
@keyframes petal{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}8%{opacity:.8}25%{transform:translate3d(calc(var(--dx)*.5),30vh,0) rotate(120deg) rotateX(60deg)}50%{transform:translate3d(calc(var(--dx)*-.3),65vh,0) rotate(240deg) rotateX(0)}92%{opacity:.8}100%{transform:translate3d(var(--dx),118vh,0) rotate(var(--rot));opacity:0}}

/* ===== SUARA ===== */
.snd{position:fixed;top:12px;right:12px;z-index:40;width:42px;height:42px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:20px;cursor:pointer;display:none}.snd.on{display:block}

/* ===== PHOTOBOOTH ===== */
#booth{--rose:#c9566b;--blush:#fbe3e6;--wine:#4a1424;--gold:#e0b25a;position:fixed;inset:0;z-index:30;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:0 0 40px;font-family:'Cormorant Garamond',Georgia,serif;color:var(--wine);background:var(--wine) repeating-linear-gradient(90deg,#5c1a2e 0 28px,#4a1424 28px 56px);opacity:0;pointer-events:none;transition:opacity .8s}
#booth.show{opacity:1;pointer-events:auto}
.sign{margin:30px 0 18px;padding:12px 34px;background:#2b0b15;border:4px solid var(--gold);border-radius:10px;color:#ffe9a8;font:700 24px 'Courier Prime',monospace;letter-spacing:.2em;text-shadow:0 0 12px #ffcb52;box-shadow:0 0 0 3px #2b0b15,0 0 26px #e0b25a88;position:relative}
.sign:before,.sign:after{content:"";position:absolute;left:10px;right:10px;height:6px;background:radial-gradient(circle,#fff3c4 2.5px,transparent 3px) 0 0/16px 6px}
.sign:before{top:-14px}.sign:after{bottom:-14px}
.strip{--p:#fffaf3;--i:#4a1424;position:relative;width:min(78vw,290px);background:var(--p);color:var(--i);padding:16px 16px 14px;box-shadow:0 14px 36px #000b;border-radius:3px;transform:rotate(-1.2deg);transition:background .3s,color .3s}
.slot{position:relative;display:block;width:100%;aspect-ratio:4/3;margin-bottom:12px;background:#0003 center/cover;border:2px solid var(--i);cursor:pointer;overflow:hidden;font:700 13px 'Courier Prime',monospace;color:var(--i)}
.slot.empty:after{content:"+ ketuk untuk foto";position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:.7}
.slot:active{filter:brightness(.9)}
.slot b{position:absolute;right:6px;top:4px;font-size:16px;font-style:normal;pointer-events:none}
.cap{text-align:center;font:700 13px 'Courier Prime',monospace;letter-spacing:.1em;line-height:1.7}
.cap em{display:block;font:400 30px 'Pinyon Script',cursive;letter-spacing:0;color:var(--rose)}
.st{position:absolute;font-size:30px;pointer-events:none;filter:drop-shadow(0 2px 2px #0005)}
.row{display:flex;gap:10px;margin:22px 0 4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff8;cursor:pointer}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 3px #0006}
.tip{color:var(--blush);font-style:italic;font-size:18px;text-align:center;margin:12px 24px 0}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.btn{font:700 15px 'Courier Prime',monospace;letter-spacing:.08em;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:13px 26px;margin-top:22px;cursor:pointer;box-shadow:0 5px 0 #8d3447;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8d3447}
.btn.alt{background:var(--gold);color:var(--wine);box-shadow:0 5px 0 #a8802f}
.btn.alt:active{box-shadow:0 1px 0 #a8802f}
input[type=file]{display:none}
.hidden{display:none!important}
@media(max-width:520px){.envelope{height:205px}.letter-body{font-size:17px}.action{padding:12px 17px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="dunia"><div id="kamera"><div id="meja"></div><section id="intro"><div class="envelope-wrap"><div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Buka amplop"><div class="env-back"></div><div class="env-paper"></div><div class="env-side"></div><div class="env-side right"></div><div class="env-front"></div><div class="env-flap"></div><div class="seal">♡</div></div></div></section></div></div><div class="grain"></div>


<section class="letter" id="letter"><div class="letter-wrap"><div class="sheet"><div class="env-open"></div><article class="letter-card" id="kartu"><div class="letter-top">A letter from the heart</div><h2 id="recipient"></h2><div class="date" id="date"></div><div class="letter-body" id="letterBody"></div><div class="signature" id="signature"></div></article></div><div class="letter-actions"><button class="action" id="nextBtn">Lihat kenangan kita →</button></div></div></section>

<div id="petals"></div>
<button class="snd" id="sndBtn" aria-label="Suara">🔊</button>

<section id="booth">
  <div class="sign">PHOTOBOOTH</div>
  <div class="strip" id="strip">
    <div id="slots"></div>
    <div class="cap"><em id="capNama">love you</em><span id="capTgl"></span></div>
    <span class="st" style="left:-14px;top:-14px">❤️</span>
    <span class="st" style="right:-12px;top:34%">✨</span>
    <span class="st" style="left:-16px;bottom:22%">🌹</span>
    <span class="st" style="right:-14px;bottom:-12px">💗</span>
  </div>
  <div class="row" id="sw"></div>
  <p class="tip">Ketuk foto mana saja untuk menggantinya</p>
  <div class="btns"><button class="btn" id="dl">⬇ UNDUH</button><button class="btn alt" id="all">GANTI SEMUA FOTO</button></div>
  <input type="file" id="one" accept="image/*"><input type="file" id="many" accept="image/*" multiple>
</section>

<script>
/* ====== UBAH BAGIAN INI SAJA ====== */
const UNTUK = "Untuk kamu, sayangku";
const DARI = "— dari aku, yang selalu sayang kamu";
const TANGGAL = "07 · 11 · 2026";
const ISI = [
  "Awalnya cuma iseng ngobrol, sekarang malah jadi rutinitas yang aku tunggu. Baru beberapa hari, tapi kok rasanya udah lama aku kenal kamu.",
  "Hari-hari aku jadi lebih ramai, lebih hangat, dan lebih berwarna, cuma gara-gara ada kamu. Aku tunggu kabar kamu tiap pagi, aku tunggu balasan kamu tiap malam.",
  "Dari situ ngajarin aku, kalau bahagia itu gak harus hal besar. Cukup kamu balas chat, nanya udah makan atau belum, itu aja udah cukup bikin hati aku hangat.",
  "Entah ke depannya jadi apa, yang jelas sekarang aku senang. Semoga bisa terus lanjut."
];
const FOTO = ["foto/1.jpg","foto/2.jpg","foto/3.jpg","foto/4.jpg"];
const MAWAR = {besar:"foto/mawar-besar.png", kecil:"foto/mawar-kecil.png"};
/* suara: isi path file kalau sudah ada, kosongkan ("") untuk mematikan */
const SOUND = {musik:"sound/musik.mp3", buka:"sound/buka.mp3", klik:"sound/klik.mp3", jepret:"sound/jepret.mp3"};
/* ================================== */

const $ = id => document.getElementById(id);

/* meja kayu penuh buku (acak tetap, tidak berubah tiap reload) */
(()=>{let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
const C=[["#7a1f33","#4e1021"],["#2f5a45","#1c3a2c"],["#27406b","#162744"],["#8a5a2b","#5a3416"],["#d8c19a","#a98c5e"],["#5d2e5e","#3a1b3b"],["#2c6870","#1a4249"]];
let h="";for(let i=0,n=0;n<20&&i<300;i++){const x=r()*108-4,y=r()*108-4;if(Math.abs(x-50)<22&&Math.abs(y-50)<13)continue;n++;
const w=.38+r()*.24,c=C[Math.floor(r()*C.length)];
h+=`<i class="book" style="left:${x}%;top:${y}%;width:calc(var(--E)*${w});height:calc(var(--E)*${w*1.38});--a:${c[0]};--b:${c[1]};transform:translate(-50%,-50%) translateZ(${n%5*12}px) rotate(${r()*360}deg)"></i>`}
$("meja").innerHTML=h})();

/* suara */
const audio={};let mute=false;
for(const k in SOUND)if(SOUND[k])audio[k]=new Audio(SOUND[k]);
if(audio.musik){audio.musik.loop=true;audio.musik.volume=.5}
const play=k=>{const a=audio[k];if(!a||mute)return;if(k!=="musik")a.currentTime=0;a.play().catch(()=>{})};
$("sndBtn").onclick=()=>{
  mute=!mute;$("sndBtn").textContent=mute?"🔇":"🔊";
  for(const k in audio)audio[k].muted=mute;
  if(audio.musik)mute?audio.musik.pause():audio.musik.play().catch(()=>{});
};

/* surat dilipat tiga: tiap lipatan memuat salinan kartu yang digeser, lalu diganti kartu asli setelah selesai */
function lipat(){
  const c=$("kartu"),H=c.offsetHeight,h=H/3,w=document.createElement("div");
  w.className="lipat";w.style.height=H+"px";
  let par=w;
  for(let k=0;k<3;k++){
    const p=document.createElement("div"),f=document.createElement("div"),b=document.createElement("div"),cl=c.cloneNode(true);
    p.className="pn pn"+k;p.style.height=h+"px";f.className="fr";b.className="bk";
    cl.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    cl.removeAttribute("id");cl.setAttribute("aria-hidden","true");
    cl.style.cssText=`position:absolute;left:0;width:100%;height:${H}px;top:${-k*h}px`;
    f.appendChild(cl);p.append(f,b);par.appendChild(p);par=p;
  }
  c.style.visibility="hidden";c.parentNode.appendChild(w);
  setTimeout(()=>{w.remove();c.style.visibility=""},2900);
}

/* kelopak mawar */
const ada={};let pt=0;
for(const k in MAWAR){const i=new Image();i.onload=()=>ada[k]=1;i.src=MAWAR[k]}
function petal(){
  if($("petals").children.length>22)return;
  const k=Math.random()<.4?"besar":"kecil",s=k==="besar"?20+Math.random()*10:10+Math.random()*7,e=document.createElement("span");
  e.className="petal";
  e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s*(ada[k]?1:.8)}px;--dx:${(Math.random()-.5)*160}px;--rot:${360+Math.random()*540}deg;animation-duration:${7+Math.random()*7}s`;
  if(ada[k]){e.classList.add("img");e.style.backgroundImage=`url("${MAWAR[k]}")`}
  e.onanimationend=()=>e.remove();
  $("petals").appendChild(e);
}
function startPetals(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  for(let i=0;i<6;i++)setTimeout(petal,i*350);
  pt=setInterval(petal,650);
}

/* buka amplop */

/* ===== photobooth ===== */
const THEMES=[{p:"#fffaf3",i:"#4a1424",c:"#c9566b"},{p:"#ffd6de",i:"#7a1f3a",c:"#c9566b"},{p:"#1c1c24",i:"#f6e7c1",c:"#e0b25a"},{p:"#e4d9ff",i:"#3b2a6b",c:"#7a5ad1"}];
let theme=THEMES[0],cur=0;
const srcs=FOTO.slice(),slots=$("slots");
srcs.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="slot empty";d.innerHTML="<b>❤</b>";
  d.onclick=()=>{cur=i;play("klik");$("one").click()};
  slots.appendChild(d);
  const im=new Image();im.onload=()=>setSlot(i,s);im.src=s;
});
function setSlot(i,src){
  srcs[i]=src;
  const d=slots.children[i];
  d.style.backgroundImage=`url("${src}")`;
  d.classList.remove("empty");
}
$("one").onchange=e=>{const f=e.target.files[0];if(f)setSlot(cur,URL.createObjectURL(f));e.target.value=""};
$("all").onclick=()=>{play("klik");$("many").click()};
$("many").onchange=e=>{[...e.target.files].slice(0,4).forEach((f,i)=>setSlot(i,URL.createObjectURL(f)));e.target.value=""};

THEMES.forEach((t,i)=>{
  const s=document.createElement("div");
  s.className="sw"+(i?"":" on");s.style.background=t.p;
  s.onclick=()=>{
    play("klik");theme=t;
    $("strip").style.setProperty("--p",t.p);$("strip").style.setProperty("--i",t.i);
    $("capNama").style.color=t.c;
    [...$("sw").children].forEach(x=>x.classList.remove("on"));s.classList.add("on");
  };
  $("sw").appendChild(s);
});

const load=src=>new Promise(r=>{if(!src)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src});
$("dl").onclick=async()=>{
  play("jepret");
  await document.fonts.ready;
  const W=600,pad=40,pw=W-pad*2,ph=390,gap=28,top=40,foot=150;
  const H=top+srcs.length*(ph+gap)-gap+foot;
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  x.fillStyle=theme.p;x.fillRect(0,0,W,H);
  const imgs=await Promise.all(srcs.map(load));
  imgs.forEach((im,i)=>{
    const y=top+i*(ph+gap);
    x.fillStyle="#0003";x.fillRect(pad,y,pw,ph);
    if(im){
      const r=Math.max(pw/im.width,ph/im.height),w=im.width*r,h=im.height*r;
      x.save();x.beginPath();x.rect(pad,y,pw,ph);x.clip();
      x.drawImage(im,pad+(pw-w)/2,y+(ph-h)/2,w,h);x.restore();
    }
    x.lineWidth=6;x.strokeStyle=theme.i;x.strokeRect(pad,y,pw,ph);
    x.font="34px serif";x.fillStyle=theme.c;x.textAlign="right";
    x.fillText("❤",pad+pw-12,y+42);
  });
  const fy=H-foot+54;
  x.textAlign="center";
  x.fillStyle=theme.c;x.font="64px 'Pinyon Script',cursive";x.fillText("love you",W/2,fy);
  x.fillStyle=theme.i;x.font="700 24px 'Courier Prime',monospace";x.fillText(TANGGAL,W/2,fy+46);
  x.font="34px serif";x.fillText("🌹 ✨ 💗",W/2,fy+92);
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="photobooth.png";a.click()},"image/png");
};
</script>
